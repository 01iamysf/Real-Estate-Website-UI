<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meridian &amp; Co. — Estate Brokerage</title>
  <meta name="description" content="Meridian & Co. — a private estate brokerage curating exceptional homes beyond ordinary." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body> 

  <!-- ======= NAVBAR ======= -->
  <header class="nav" id="navbar">
    <div class="nav__inner container">
      <a href="#home" class="brand" aria-label="Home">
        <span class="brand__name" id="brandName">Meridian &amp; Co.</span>
        <span class="brand__tag" id="brandTag">Estate Brokerage</span>
      </a>

      <nav class="nav__links" id="navLinks" aria-label="Primary"></nav>

      <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span class="nav__toggle-bar"></span>
        <span class="nav__toggle-bar"></span>
      </button>
    </div>
  </header>

  <!-- ======= HERO ======= -->
  <section class="hero" id="home">
    <div class="hero__media">
      <img id="heroImage" src="" alt="Luxury estate at dusk" />
      <div class="hero__scrim"></div>
    </div>

    <div class="hero__content container">
      <p class="overline hero__overline reveal" id="heroOverline"></p>
      <h1 class="hero__title reveal" id="heroTitle"></h1>
      <p class="hero__lede reveal" id="heroLede"></p>
      <div class="hero__actions reveal" id="heroActions"></div>
    </div>

    <div class="hero__meta container">
      <span id="heroMeta"></span>
      <span class="hero__scroll">Scroll <span class="hero__scroll-line"></span></span>
    </div>
  </section>

  <main>

    <!-- ======= PROPERTIES ======= -->
    <section class="section" id="properties">
      <div class="container">
        <header class="section-head reveal">
          <p class="overline" id="propertiesOverline"></p>
          <div class="section-head__row">
            <h2 class="section-head__title" id="propertiesTitle"></h2>
            <p class="section-head__note" id="propertiesNote"></p>
          </div>
        </header>

        <!-- ======= PROPERTY FILTERS ======= -->
        <div class="filters reveal">
          <div class="filters__group">
            <div class="filters__search">
              <input type="text" id="filterSearch" placeholder="Search by name or location..." aria-label="Search properties" />
              <svg class="filters__search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.5" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            
            <div class="filters__select-wrapper">
              <select id="filterLocation" aria-label="Filter by Location">
                <option value="all">All Locations</option>
                <option value="lucknow">Lucknow</option>
                <option value="goa">Goa</option>
                <option value="uttarakhand">Uttarakhand</option>
              </select>
            </div>

            <div class="filters__select-wrapper">
              <select id="filterBeds" aria-label="Filter by Beds">
                <option value="all">All Bedrooms</option>
                <option value="4">4+ Beds</option>
                <option value="5">5+ Beds</option>
                <option value="6">6+ Beds</option>
              </select>
            </div>

            <div class="filters__select-wrapper">
              <select id="filterPrice" aria-label="Filter by Price">
                <option value="all">All Prices</option>
                <option value="under10">Under ₹10 Crores</option>
                <option value="10to20">₹10 - ₹20 Crores</option>
                <option value="above20">Above ₹20 Crores</option>
              </select>
            </div>
            
            <div class="filters__select-wrapper">
              <select id="sortOrder" aria-label="Sort Properties">
                <option value="default">Default Sort</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
              </select>
            </div>
          </div>
        </div>

        <div class="grid" id="propertiesGrid"></div>
      </div>
    </section>

    <!-- ======= STATS ======= -->
    <section class="stats">
      <div class="container">
        <div class="stats__grid" id="statsGrid"></div>
      </div>
    </section>

    <!-- ======= ABOUT ======= -->
    <section class="section section--alt" id="about">
      <div class="container">
        <div class="about">
          <div class="about__text reveal">
            <p class="overline" id="aboutOverline"></p>
            <h2 class="section-head__title" id="aboutTitle"></h2>
            <p class="about__body" id="aboutBody"></p>
            <blockquote class="about__quote" id="aboutQuote"></blockquote>
            <div id="aboutActions"></div>
          </div>

          <div class="about__media reveal">
            <img id="aboutImage" src="" alt="" loading="lazy" />
            <p class="about__caption" id="aboutCaption"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ======= TESTIMONIALS ======= -->
    <section class="section" id="testimonials">
      <div class="container">
        <header class="section-head reveal">
          <p class="overline" id="testimonialsOverline"></p>
          <div class="section-head__row">
            <h2 class="section-head__title" id="testimonialsTitle"></h2>
          </div>
        </header>

        <div class="testimonials" id="testimonialsGrid"></div>
      </div>
    </section>

    <!-- ======= CONTACT ======= -->
    <section class="section section--alt section--contact" id="contact">
      <div class="container">
        <header class="section-head reveal">
          <p class="overline" id="contactOverline"></p>
          <div class="section-head__row">
            <h2 class="section-head__title" id="contactTitle"></h2>
            <p class="section-head__note" id="contactNote"></p>
          </div>
        </header>

        <div class="contact">
          <div class="contact__info reveal">
            <p class="contact__line"><span class="contact__label">By appointment</span> <a id="contactPhone"></a></p>
            <p class="contact__line"><span class="contact__label">Correspondence</span> <a id="contactEmail"></a></p>
            <p class="contact__line"><span class="contact__label">The office</span> <span id="contactAddress"></span></p>
            <p class="contact__hours" id="contactHours"></p>
          </div>

          <form class="form reveal" id="contactForm" novalidate>
            <div class="form__field">
              <label class="form__label" for="name">Full name</label>
              <input class="form__input" type="text" id="name" name="name" autocomplete="name" placeholder="Eleanor Hale" />
              <p class="form__error" data-error="name"></p>
            </div>

            <div class="form__row">
              <div class="form__field">
                <label class="form__label" for="email">Email</label>
                <input class="form__input" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" />
                <p class="form__error" data-error="email"></p>
              </div>
              <div class="form__field">
                <label class="form__label" for="phone">Phone</label>
                <input class="form__input" type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+1 (415) 555-0148" />
                <p class="form__error" data-error="phone"></p>
              </div>
            </div>

            <div class="form__field">
              <label class="form__label" for="message">Message</label>
              <textarea class="form__input form__input--area" id="message" name="message" rows="5" placeholder="Tell us about the home you are looking for…"></textarea>
              <p class="form__error" data-error="message"></p>
            </div>

            <button class="btn btn--solid" type="submit" id="formSubmit">Send Enquiry</button>
            <p class="form__success" id="formStatus" role="status"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- ======= FOOTER ======= -->
  <footer class="footer">
    <div class="container">
      <div class="footer__grid">
        <div class="footer__brand">
          <span class="brand__name" id="footerBrandName"></span>
          <span class="brand__tag" id="footerBrandTag"></span>
          <p class="footer__note" id="footerNote"></p>
        </div>
        <div id="footerColumns"></div>
      </div>
      <div class="footer__base">
        <p>© <span id="year">2026</span> <span id="footerBrandBase"></span>. All rights reserved.</p>
        <p>Photography courtesy of Unsplash.</p>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
